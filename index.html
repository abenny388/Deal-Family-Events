<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Family Calendar Events</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #fffafb;
            background-image: radial-gradient(rgba(217, 70, 239, 0.04) 1px, transparent 0);
            background-size: 24px 24px;
            margin: 0;
            padding: 24px;
            color: #404040;
        }
        .max-w-5xl { max-w: 1024px; margin: 0 auto; }
        header { border-b: 1px solid #ffe4e6; padding-bottom: 24px; margin-bottom: 32px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #171717; margin: 0; }
        .subtitle { color: #737373; margin-top: 8px; font-size: 1rem; }
        
        .month-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
        .tab-btn { 
            background: #ffffff; border: 1px solid #ffe4e6; padding: 8px 16px; 
            font-size: 0.75rem; font-weight: 600; border-radius: 9999px; cursor: pointer; 
            letter-spacing: 0.05em; text-transform: uppercase; transition: all 0.2s;
        }
        .tab-btn.active { background: #f43f5e; color: #ffffff; border-color: #f43f5e; box-shadow: 0 4px 6px -1px rgba(244, 63, 94, 0.2); }
        
        .layout-grid { display: grid; grid-template-columns: 1fr; gap: 32px; }
        @media (min-width: 1024px) { .layout-grid { grid-template-columns: 2fr 1fr; } }
        
        .calendar-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(4px); border: 1px solid #ffe4e6; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(251, 113, 133, 0.05); }
        .calendar-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: #171717; margin: 0 0 24px 0; border-bottom: 1px solid #f5f5f5; padding-bottom: 8px; }
        .weekdays-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; font-weight: 600; color: #f43f5e; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        
        .day-cell { min-height: 72px; border: 1px solid #ffe4e6; border-radius: 12px; padding: 8px; background: rgba(255, 255, 255, 0.5); display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; position: relative; }
        .day-num { font-size: 0.75rem; font-weight: 700; color: #cbd5e1; }
        .blank-cell { opacity: 0; pointer-events: none; }
        
        .evt-hawaii { background: #f0fdfa; border: 1px solid #99f6e4; color: #115e59; cursor: pointer; transition: transform 0.2s; }
        .evt-thanksgiving { background: #fff5f5; border: 1px solid #fee2e2; color: #991b1b; cursor: pointer; transition: transform 0.2s; }
        .evt-christmas { background: #fdf4ff; border: 1px solid #f3e8ff; color: #6b21a8; cursor: pointer; transition: transform 0.2s; }
        .evt-newyear { background: #eef2ff; border: 1px solid #e0e7ff; color: #3730a3; cursor: pointer; transition: transform 0.2s; }
        .evt-tahoe { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; cursor: pointer; transition: transform 0.2s; }
        .day-cell:hover { transform: scale(1.03); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .evt-label { font-size: 9px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; width: 100%; }
        
        .inspector-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(4px); border: 1px solid #ffe4e6; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(251, 113, 133, 0.05); height: max-content; }
        .panel-placeholder { text-align: center; padding: 48px 0; color: #a3a3a3; font-size: 0.875rem; }
        .panel-evt-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; color: #171717; margin: 0; }
        .panel-meta { font-size: 0.75rem; color: #f43f5e; font-weight: 600; margin: 4px 0 0 0; }
        .panel-loc { font-size: 0.75rem; color: #a3a3a3; margin: 2px 0 0 0; }
        .panel-desc { font-size: 0.75rem; line-height: 1.6; color: #525252; border-top: 1px solid #f5f5f5; padding-top: 12px; margin-top: 12px; }
        .panel-details-box { border-top: 1px solid #f5f5f5; padding-top: 12px; margin-top: 12px; font-size: 0.75rem; }
        .details-row { margin-bottom: 8px; }
        .details-label { font-weight: 700; color: #404040; display: block; margin-bottom: 2px; }
        .details-val { color: #525252; }
        
        .btn-row { display: flex; gap: 8px; border-top: 1px solid #f5f5f5; padding-top: 16px; margin-top: 16px; }
        .btn-main { flex: 1; border: none; padding: 8px 16px; font-size: 0.75rem; font-weight: 600; border-radius: 9999px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .btn-accept { background: #171717; color: #ffffff; }
        .btn-accept:hover { background: #262626; }
        .btn-decline { background: #ffffff; color: #404040; border: 1px solid #e5e5e5; }
        .btn-decline:hover { background: #fafafa; }
        .btn-state-accept { background: #10b981 !important; color: #ffffff !important; border: none !important; cursor: default; }
        .btn-state-decline { background: #f43f5e !important; color: #ffffff !important; border: none !important; cursor: default; }
    </style>
</head>
<body>
    <div class="max-w-5xl">
        <header>
            <h1>Deal Family Calendar Events</h1>
            <div class="subtitle">Interactive Calendar View. Select an event date block to review accommodation details, au pair hour expectations, and submit your response.</div>
        </header>

        <div class="month-tabs" id="month-tabs"></div>

        <div class="layout-grid">
            <div class="calendar-card">
                <h2 id="calendar-month-title" class="calendar-title"></h2>
                <div class="weekdays-header">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div class="days-grid" id="calendar-days-grid"></div>
            </div>

            <div class="inspector-card" id="details-panel">
                <div class="panel-placeholder">
                    ℹ️ Click or tap on a colored event block in the calendar to manage its status.
                </div>
            </div>
        </div>
    </div>

    <script>
        const eventsData = [
            { id: 0, name: "Deal Family Trip to Hawaii", start: "2026-11-07", end: "2026-11-14", colorClass: "evt-hawaii", location: "Maui, Hawaii", desc: "We will join Andy’s family for some fun in the sun - the family loves to swim and snorkel, hike, and relax on the beach. This will be a good opportunity to experience American culture and practice your English.", bed: "Spare bedroom available", hours: "Monday through Friday are listed as “bonus days” in the family handbook - childcare support is not needed for this event." },
            { id: 1, name: "Thanksgiving Weekend", start: "2026-11-26", end: "2026-11-29", colorClass: "evt-thanksgiving", location: "The Benny House, Roseville CA", desc: "Alyssa’s Parents host friends and family for a delicious feast including a traditional carved turkey, stuffing, and other traditional side dishes.", bed: "Spare bedroom available", hours: "Thursday and Friday are listed as “bonus days” in the family handbook - childcare support is not needed for this event." },
            { id: 2, name: "Christmas in Healdsburg", start: "2026-12-24", end: "2026-12-25", colorClass: "evt-christmas", location: "The Deal House, Healdsburg CA", desc: "Andy’s Parents host friends and family for a Christmas Eve dinner, including tortellini in broth and other Italian dishes.", bed: "No spare bedroom, couch only", hours: "Thursday and Friday are listed as “bonus days” in the family handbook - childcare support is not needed for this event." },
            { id: 3, name: "New Years in Dillon Beach", start: "2026-12-31", end: "2027-01-03", colorClass: "evt-newyear", location: "Beach House Rental", desc: "Andy’s Parents join friends and family for a cozy winter beach trip. There are a lot of dogs, hikes along the water, and puzzles / boardgames.", bed: "No spare bedroom, couch only", hours: "Friday is listed as a “bonus day” in the family handbook - childcare support is needed Thursday before we travel." },
            { id: 4, name: "Tahoe", start: "2027-01-21", end: "2027-01-24", colorClass: "evt-tahoe", location: "South Lake Tahoe", desc: "Andy and Alyssa will host friends for a ski weekend", bed: "Spare bedroom available", hours: "Childcare is needed Thursday and Friday. Alternative arrangements can be made if you want to take PTO these days instead of traveling." },
            { id: 5, name: "Tahoe", start: "2027-02-04", end: "2027-02-07", colorClass: "evt-tahoe", location: "South Lake Tahoe", desc: "Andy and Alyssa will host friends for a ski weekend", bed: "Spare bedroom available", hours: "Childcare is needed Thursday and Friday. Alternative childcare arrangements can be made if you want to take PTO these days instead of traveling." },
            { id: 6, name: "Tahoe", start: "2027-03-18", end: "2027-03-25", colorClass: "evt-tahoe", location: "South Lake Tahoe", desc: "Andy and Alyssa will host friends for a ski week", bed: "Spare bedroom available", hours: "Childcare is needed Th, Fri, Mon, Tue, Wed, and part of Thurs. Alternative childcare arrangements can be made if you want to take PTO these days instead of traveling." }
        ];
const monthConfigs = [
{ label: "Nov 2026", year: 2026, month: 10, days: 30, startDay: 0 },
{ label: "Dec 2026", year: 2026, month: 11, days: 31, startDay: 2 },
{ label: "Jan 2027", year: 2027, month: 0,  days: 31, startDay: 5 },
{ label: "Feb 2027", year: 2027, month: 1,  days: 28, startDay: 1 },
{ label: "Mar 2027", year: 2027, month: 2,  days: 31, startDay: 1 }
];
let rsvpState = {};
let currentMonthIdx = 0;
function initTabs() {
const container = document.getElementById('month-tabs');
container.innerHTML = '';
monthConfigs.forEach((cfg, idx) => {
const btn = document.createElement('button');
btn.className = 'tab-btn' + (idx === currentMonthIdx ? ' active' : '');
btn.innerText = cfg.label;
btn.onclick = function() { currentMonthIdx = idx; initTabs(); renderCalendar(); };
container.appendChild(btn);
});
}
function renderCalendar() {
const cfg = monthConfigs[currentMonthIdx];
document.getElementById('calendar-month-title').innerText = cfg.label;
const grid = document.getElementById('calendar-days-grid');
grid.innerHTML = '';
for (let i = 0; i < cfg.startDay; i++) {
const blank = document.createElement('div');
blank.className = 'day-cell blank-cell';
grid.appendChild(blank);
}
for (let day = 1; day <= cfg.days; day++) {
const dayDiv = document.createElement('div');
dayDiv.className = 'day-cell';
const dayLabel = document.createElement('span');
dayLabel.className = 'day-num';
dayLabel.innerText = day;
dayDiv.appendChild(dayLabel);
const currentStr = cfg.year + '-' + String(cfg.month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
const activeEvt = eventsData.find(function(e) { return currentStr >= e.start && currentStr <= e.end; });
if (activeEvt) {
dayDiv.className = 'day-cell ' + activeEvt.colorClass;
const indicator = document.createElement('div');
indicator.className = 'evt-label';
indicator.innerText = rsvpState[activeEvt.id] ? '👑 ' + rsvpState[activeEvt.id] : activeEvt.name;
dayDiv.appendChild(indicator);
dayDiv.onclick = function() { inspectEvent(activeEvt.id); };
}
grid.appendChild(dayDiv);
}
}
function inspectEvent(evtId) {
const evt = eventsData.find(function(e) { return e.id === evtId; });
const panel = document.getElementById('details-panel');
const status = rsvpState[evtId] || null;
panel.innerHTML = '';
const headerDiv = document.createElement('div');
headerDiv.innerHTML = "" + evt.name + "" +
"🗓️ Dates: " + evt.start + " to " + evt.end + "" +
"📍 Location: " + evt.location + "";
panel.appendChild(headerDiv);
const descP = document.createElement('p');
descP.className = "panel-desc";
descP.innerText = "Description: " + evt.desc;
panel.appendChild(descP);
const metaDiv = document.createElement('div');
metaDiv.className = "panel-details-box";
// 3. Meta Details Box (With explicit block rows and spacing)
            const metaDiv = document.createElement('div');
            metaDiv.className = "panel-details-box";
            
            let detailsHtml = "";
            detailsHtml += "<div class='details-row' style='margin-bottom: 16px; display: block;'>";
            detailsHtml += "  <strong class='details-label' style='display: block; margin-bottom: 4px;'>Sleeping Accommodations:</strong>";
            detailsHtml += "  <span class='details-val' style='display: block; color: #525252;'>" + evt.bed + "</span>";
            detailsHtml += "</div>";
            
            detailsHtml += "<div class='details-row' style='margin-bottom: 16px; display: block;'>";
            detailsHtml += "  <strong class='details-label' style='display: block; margin-bottom: 4px;'>Au Pair Hours:</strong>";
            detailsHtml += "  <span class='details-val' style='display: block; color: #525252;'>" + evt.hours + "</span>";
            detailsHtml += "</div>";
            
            metaDiv.innerHTML = detailsHtml;
            panel.appendChild(metaDiv);
const btnDiv = document.createElement('div');
btnDiv.className = "btn-row";
const acceptBtn = document.createElement('button');
acceptBtn.className = "btn-main " + (status === 'Attending' ? 'btn-state-accept' : 'btn-accept');
acceptBtn.innerText = status === 'Attending' ? '✓ Attending' : 'Accept';
if (status !== 'Attending') {
acceptBtn.onclick = function() { submitRSVP(evtId, 'Attending'); };
}
btnDiv.appendChild(acceptBtn);
const declineBtn = document.createElement('button');
declineBtn.className = "btn-main " + (status === 'Declined' ? 'btn-state-decline' : 'btn-decline');
declineBtn.innerText = status === 'Declined' ? '✕ Declined' : 'Decline';
if (status !== 'Declined') {
declineBtn.onclick = function() { submitRSVP(evtId, 'Declined'); };
}
btnDiv.appendChild(declineBtn);
panel.appendChild(btnDiv);
}
function submitRSVP(evtId, stringStatus) {
rsvpState[evtId] = stringStatus;
inspectEvent(evtId);
renderCalendar();
}
initTabs();
renderCalendar();
            function submitRSVP(evtId, stringStatus) {
            rsvpState[evtId] = stringStatus;
            inspectEvent(evtId);
            renderCalendar();

            const eventDetails = eventsData.find(function(e) { return e.id === evtId; });

            // ⚠️ REPLACE THE URL BELOW WITH YOUR COPIED ZAPIER WEBHOOK URL STRING
            const zapierWebhookUrl = "https://hooks.zapier.com/hooks/catch/29297940/49im7pc/";

            // Convert payload properties cleanly into url-encoded form values
            const formData = new URLSearchParams();
            formData.append('eventName', eventDetails.name);
            formData.append('startDate', eventDetails.start);
            formData.append('endDate', eventDetails.end);
            formData.append('location', eventDetails.location);
            formData.append('hoursHandbookScope', eventDetails.hours);
            formData.append('lodgingSetup', eventDetails.bed);
            formData.append('auPairResponse', stringStatus);
            formData.append('timestampSubmitted', new Date().toISOString());

            // Dispatch using native url-encoded format to guarantee Zapier parses the text fields
            fetch(zapierWebhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            })
            .then(function() { console.log("RSVP safely captured by Zapier."); })
            .catch(function(err) { console.error("Network tracking exception:", err); });
        }
    </script>
</body>
</html>
