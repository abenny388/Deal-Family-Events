<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Family Calendar Events</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .bg-sparkle {
            background-color: #fffafb;
            background-image: radial-gradient(rgba(217, 70, 239, 0.04) 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-sparkle min-h-screen p-4 md:p-8 text-neutral-800">
    <div class="max-w-5xl mx-auto">
        <header class="mb-10 border-b pb-8 border-rose-100">
            <h1 class="text-4xl font-serif font-bold text-neutral-900 tracking-tight">Deal Family Calendar Events</h1>
            <p class="text-neutral-500 mt-2 text-md md:text-lg">Interactive Calendar View. Select an event date block to review accommodation details, au pair hour expectations, and submit your response.</p>
        </header>

        <!-- Month Navigation Switcher -->
        <div class="flex flex-wrap gap-2 mb-8" id="month-tabs"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Calendar Matrix Grid -->
            <div class="lg:col-span-2 bg-white/80 backdrop-blur-sm border border-rose-100 rounded-2xl p-6 shadow-md shadow-rose-100/40">
                <h2 id="calendar-month-title" class="text-2xl font-serif font-bold text-neutral-900 mb-6 border-b pb-2 border-slate-100"></h2>
                <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-rose-400 uppercase tracking-widest mb-3">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div class="grid grid-cols-7 gap-2" id="calendar-days-grid"></div>
            </div>

            <!-- Context Inspector Panel -->
            <div class="bg-white/80 backdrop-blur-sm border border-rose-100 rounded-2xl p-6 shadow-md shadow-rose-100/40 h-fit space-y-4" id="details-panel">
                <div class="text-center py-12 text-neutral-400 text-sm">
                    ℹ️ Click or tap on a colored event block in the calendar to manage its status.
                </div>
            </div>
        </div>
    </div>

    <script>
        const eventsData = [
            { id: 0, name: "Deal Family Trip to Hawaii", start: "2026-11-07", end: "2026-11-14", color: "bg-teal-50 hover:bg-teal-100/80 border-teal-200 text-teal-900", location: "Maui, Hawaii", desc: "We will join Andy’s family for some fun in the sun - the family loves to swim and snorkel, hike, and relax on the beach. This will be a good opportunity to experience American culture and practice your English.", bed: "Spare bedroom available", hours: "Monday through Friday are listed as “bonus days” in the family handbook - childcare support is not needed for this event." },
            { id: 1, name: "Thanksgiving Weekend", start: "2026-11-26", end: "2026-11-29", color: "bg-rose-50 hover:bg-rose-100/80 border-rose-200 text-rose-900", location: "The Benny House, Roseville CA", desc: "Alyssa’s Parents host friends and family for a delicious feast including a traditional carved turkey, stuffing, and other traditional side dishes.", bed: "Spare bedroom available", hours: "Thursday and Friday are listed as “bonus days” in the family handbook - childcare support is not needed for this event." },
            { id: 2, name: "Christmas in Healdsburg", start: "2026-12-24", end: "2026-12-25", color: "bg-fuchsia-50 hover:bg-fuchsia-100/80 border-fuchsia-200 text-fuchsia-900", location: "The Deal House, Healdsburg CA", desc: "Andy’s Parents host friends and family for a Christmas Eve dinner, including tortellini in broth and other Italian dishes.", bed: "No spare bedroom, couch only", hours: "Thursday and Friday are listed as “bonus days” in the family handbook - childcare support is not needed for this event." },
            { id: 3, name: "New Years in Dillon Beach", start: "2026-12-31", end: "2027-01-03", color: "bg-indigo-50 hover:bg-indigo-100/80 border-indigo-200 text-indigo-900", location: "Beach House Rental", desc: "Andy’s Parents join friends and family for a cozy winter beach trip. There are a lot of dogs, hikes along the water, and puzzles / boardgames.", bed: "No spare bedroom, couch only", hours: "Friday is listed as a “bonus day” in the family handbook - childcare support is needed Thursday before we travel." },
            { id: 4, name: "Tahoe", start: "2027-01-21", end: "2027-01-24", color: "bg-amber-50 hover:bg-amber-100/80 border-amber-200 text-amber-900", location: "South Lake Tahoe", desc: "Andy and Alyssa will host friends for a ski weekend", bed: "Spare bedroom available", hours: "Childcare is needed Thursday and Friday. Alternative arrangements can be made if you want to take PTO these days instead of traveling." },
            { id: 5, name: "Tahoe", start: "2027-02-04", end: "2027-02-07", color: "bg-amber-50 hover:bg-amber-100/80 border-amber-200 text-amber-900", location: "South Lake Tahoe", desc: "Andy and Alyssa will host friends for a ski weekend", bed: "Spare bedroom available", hours: "Childcare is needed Thursday and Friday. Alternative childcare arrangements can be made if you want to take PTO these days instead of traveling." },
            { id: 6, name: "Tahoe", start: "2027-03-18", end: "2027-03-25", color: "bg-amber-50 hover:bg-amber-100/80 border-amber-200 text-amber-900", location: "South Lake Tahoe", desc: "Andy and Alyssa will host friends for a ski week", bed: "Spare bedroom available", hours: "Childcare is needed Th, Fri, Mon, Tue, Wed, and part of Thurs. Alternative childcare arrangements can be made if you want to take PTO these days instead of traveling." }
        ];

        const monthConfigs = [
            { label: "Nov 2026", year: 2026, month: 10, days: 30, startDay: 0 },
            { label: "Dec 2026", year: 2026, month: 11, days: 31, startDay: 2 },
            { label: "Jan 2027", year: 2027, month: 0,  days: 31, startDay: 5 },
            { label: "Feb 2027", year: 2027, month: 1,  days: 28, startDay: 1 },
            { label: "Mar 2027", year: 2027, month: 2,  days: 31, startDay: 1 }
        ];

        let rsvpState = {};
        let currentMonthIdx = 0;

        function initTabs() {
            const container = document.getElementById('month-tabs');
            container.innerHTML = '';
            monthConfigs.forEach((cfg, idx) => {
                const btn = document.createElement('button');
                btn.className = "px-4 py-2 text-xs font-semibold rounded-full border transition tracking-wider " + (idx === currentMonthIdx ? 'bg-rose-400 text-white border-rose-400 shadow-sm shadow-rose-200' : 'bg-white text-neutral-600 border-rose-100 hover:bg-rose-50/50');
                btn.innerText = cfg.label.toUpperCase();
                btn.onclick = function() { currentMonthIdx = idx; initTabs(); renderCalendar(); };
                container.appendChild(btn);
            });
        }

        function renderCalendar() {
            const cfg = monthConfigs[currentMonthIdx];
            document.getElementById('calendar-month-title').innerText = cfg.label;
            const grid = document.getElementById('calendar-days-grid');
            grid.innerHTML = '';

            for (let i = 0; i < cfg.startDay; i++) {
                const blank = document.createElement('div');
                blank.className = "h-16 bg-transparent border border-transparent rounded-xl opacity-0";
                grid.appendChild(blank);
            }

            for (let day = 1; day <= cfg.days; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = "h-16 border border-neutral-100 rounded-xl p-1 bg-white/40 relative flex flex-col justify-between";
                
                const dayLabel = document.createElement('span');
                dayLabel.className = "text-xs font-bold text-neutral-300 ml-1 mt-0.5";
                dayLabel.innerText = day;
                dayDiv.appendChild(dayLabel);

                const currentStr = cfg.year + '-' + String(cfg.month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const activeEvt = eventsData.find(function(e) { return currentStr >= e.start && currentStr <= e.end; });
                
                if (activeEvt) {
                    dayDiv.className = "h-16 border rounded-xl p-1.5 cursor-pointer transition transform hover:scale-[1.03] hover:shadow-sm flex flex-col justify-between " + activeEvt.color;
                    const indicator = document.createElement('div');
                    indicator.className = "text-[9px] font-bold truncate leading-tight tracking-tight";
                    indicator.innerText = rsvpState[activeEvt.id] ? "👑 " + rsvpState[activeEvt.id] : activeEvt.name;
                    dayDiv.appendChild(indicator);
                    dayDiv.onclick = function() { inspectEvent(activeEvt.id); };
                }

                grid.appendChild(dayDiv);
            }
        }

        function inspectEvent(evtId) {
            const evt = eventsData.find(function(e) { return e.id === evtId; });
            const panel = document.getElementById('details-panel');
            const status = rsvpState[evtId] || null;

            let htmlString = "<div>" +
                "<h3 class=\"text-xl font-serif font-bold text-neutral-900\">" + evt.name + "</h3>" +
                "<p class=\"text-xs text-rose-400 font-semibold mt-1\">🗓️ Dates: " + evt.start + " to " + evt.end + "</p>" +
                "<p class="text-xs text-neutral-400 mt-0.5">📍 Location: " + evt.location + "" +
"" +
"<p class="text-neutral-600 text-xs leading-relaxed border-t border-neutral-100 pt-3">Description: " + evt.desc + "" +
"<div class="space-y-2 border-t border-neutral-100 pt-3 text-xs">" +
"<span class="font-bold text-neutral-700 block">Sleeping Accommodations: <span class="text-neutral-600">" + evt.bed + "" +
"<span class="font-bold text-neutral-700 block">Au Pair Hours: <span class="text-neutral-600">" + evt.hours + "" +
"" +
"<div class="flex gap-2 border-t border-neutral-100 pt-4">" +
"<button onclick="submitRSVP(" + evtId + ", 'Attending')" class="flex-1 py-2 text-xs font-semibold rounded-full border transition tracking-wider " + (status === 'Attending' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-neutral-900 text-white hover:bg-neutral-800 border-neutral-900') + "">" +
(status === 'Attending' ? '✓ Attending' : 'Accept') +
"" +
"<button onclick="submitRSVP(" + evtId + ", 'Declined')" class="flex-1 py-2 text-xs font-semibold rounded-full border transition tracking-wider " + (status === 'Declined' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-neutral-700 border-neutral-200 hover:bg-neutral-50') + "">" +
(status === 'Declined' ? '✕ Declined' : 'Decline') +
"" +
"";
panel.innerHTML = htmlString;
}
function submitRSVP(evtId, stringStatus) {
rsvpState[evtId] = stringStatus;
inspectEvent(evtId);
renderCalendar();
}
initTabs();
renderCalendar();
